server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI backend.
    # Inside Docker the backend service is reachable at http://app:8000
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Long timeout for slow pipelines (process_url can take 10+ minutes with TTS)
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 60s;
    }

    # React SPA: always serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
